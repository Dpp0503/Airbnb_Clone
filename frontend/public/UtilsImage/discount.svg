<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="tagShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Green Tag Body Gradient -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55C765"/>
      <stop offset="45%" stop-color="#3EA94C"/>
      <stop offset="100%" stop-color="#2E8038"/>
    </linearGradient>

    <!-- Metallic Gold/Brass Grommet -->
    <linearGradient id="goldGrommet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8A6D3B"/>
    </linearGradient>

    <!-- Silver Wire Loop -->
    <linearGradient id="silverWire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
  </defs>

  <g filter="url(#tagShadow)">
    <!-- Silver wire ring passing through eyelet -->
    <path d="M 23 20 C 15 12 11 19 18 26 C 22 30 26 26 23 20 Z" 
          fill="none" stroke="url(#silverWire)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Main Green Tag Shape -->
    <path d="M 24 16
             L 37 16
             C 38 16 39 16.5 39.7 17.2
             L 51 28.5
             C 51.8 29.3 51.8 30.7 51 31.5
             L 38.5 44
             C 37.7 44.8 36.3 44.8 35.5 44
             L 23 31.5
             C 22.2 30.7 21.8 29.6 21.8 28.4
             L 21.8 18.2
             C 21.8 17 22.8 16 24 16 Z" 
          fill="url(#greenGradient)" />

    <!-- Subtle Inner Highlight Line -->
    <path d="M 24.5 17 L 36.5 17 L 49.5 30 L 37.5 42 L 23 27.5 L 23 18.5 Z" 
          fill="none" stroke="#7FE38D" stroke-width="0.75" opacity="0.5"/>

    <!-- Eyelet Outer Ring -->
    <circle cx="28" cy="22.5" r="4.2" fill="url(#goldGrommet)" />

    <!-- Eyelet Inner Hole cutout -->
    <circle cx="28" cy="22.5" r="2.3" fill="#1C5223" />
  </g>
</svg>
